  <text x="88" y="306" font-family="Consolas, monospace" font-size="15" fill="#c9d1d9">}</text>
  <rect x="560" y="108" width="478" height="472" rx="6" fill="#eefaf6" stroke="#57ae85"/>
  <text x="584" y="146" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1b4332">Structured response</text>
  <text x="584" y="190" font-family="Arial, sans-serif" font-size="14" fill="#334e68">status: succeeded</text>
  <text x="584" y="228" font-family="Arial, sans-serif" font-size="14" fill="#334e68">manifest: run/manifest.json</text>
  <text x="584" y="266" font-family="Arial, sans-serif" font-size="14" fill="#334e68">artifacts: package-relative paths</text>
  <text x="584" y="304" font-family="Arial, sans-serif" font-size="14" fill="#334e68">warnings: structured list</text>
