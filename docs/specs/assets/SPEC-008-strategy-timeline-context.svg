<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">SPEC-008 Strategy Timeline with race context</title>
  <desc id="desc">Race strategy timeline with subtle full-height VSC and Safety Car bands, row-local pit markers, tyre-age labels, and distinct unknown or conflicting stint encodings.</desc>
  <defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#d8dee8"/><line x1="0" y1="0" x2="0" y2="8" stroke="#64748b" stroke-width="2"/></pattern></defs>
  <rect width="1200" height="675" fill="#f5f7fa"/><rect x="48" y="42" width="1104" height="590" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="80" y="86" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172033">2023 Bahrain GP Race Strategy</text>
  <text x="80" y="113" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Race context and tyre-age labels enabled</text>
  <text x="82" y="185" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">RACE CONTEXT · subtle bands apply to every driver row</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#334155"><text x="82" y="250">VER</text><text x="82" y="322">PER</text><text x="82" y="394">ALO</text><text x="82" y="466">SAI</text></g>
  <g stroke="#e2e8f0"><line x1="150" y1="215" x2="1100" y2="215"/><line x1="150" y1="287" x2="1100" y2="287"/><line x1="150" y1="359" x2="1100" y2="359"/><line x1="150" y1="431" x2="1100" y2="431"/><line x1="150" y1="503" x2="1100" y2="503"/></g>
  <g font-family="Arial, sans-serif" font-size="11" font-weight="700"><rect x="155" y="229" width="260" height="30" rx="5" fill="#e10600"/><text x="168" y="249" fill="#fff">S · age 1–16</text><rect x="425" y="229" width="330" height="30" rx="5" fill="#ffd12e"/><text x="438" y="249" fill="#172033">M · age 1–20</text><rect x="765" y="229" width="330" height="30" rx="5" fill="#cbd5e1" stroke="#475569"/><text x="778" y="249" fill="#172033">H · age 1–21</text>
    <rect x="155" y="301" width="220" height="30" rx="5" fill="#e10600"/><text x="168" y="321" fill="#fff">S · age 1–14</text><rect x="385" y="301" width="350" height="30" rx="5" fill="#ffd12e"/><text x="398" y="321" fill="#172033">M · age 1–22</text><rect x="745" y="301" width="350" height="30" rx="5" fill="#cbd5e1" stroke="#475569"/><text x="758" y="321" fill="#172033">H · age 1–19</text>
    <rect x="155" y="373" width="340" height="30" rx="5" fill="#e10600"/><text x="168" y="393" fill="#fff">S · age 3–22</text><rect x="505" y="373" width="175" height="30" rx="5" fill="url(#hatch)"/><text x="518" y="393" fill="#172033">CONFLICT</text><rect x="690" y="373" width="405" height="30" rx="5" fill="#ffd12e"/><text x="703" y="393" fill="#172033">M · age 1–25</text>
    <rect x="155" y="445" width="300" height="30" rx="5" fill="#e10600"/><text x="168" y="465" fill="#fff">S · age 1–18</text><rect x="465" y="445" width="260" height="30" rx="5" fill="url(#hatch)"/><text x="478" y="465" fill="#172033">UNKNOWN</text><rect x="735" y="445" width="360" height="30" rx="5" fill="#cbd5e1" stroke="#475569"/><text x="748" y="465" fill="#172033">H · age unavailable</text></g>
  <g><rect x="410" y="215" width="145" height="288" fill="#60a5fa" opacity="0.12"/><text x="468" y="230" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#1e3a5f">VSC</text><rect x="750" y="215" width="125" height="288" fill="#f6c445" opacity="0.14"/><text x="806" y="230" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#713f12">SC</text></g>
  <g fill="#172033"><path d="M415 226 l6 -10 l6 10 z"/><path d="M755 298 l6 -10 l6 10 z"/><path d="M495 370 l6 -10 l6 10 z"/><path d="M725 442 l6 -10 l6 10 z"/></g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#64748b"><text x="150" y="535">L1</text><text x="380" y="535">L15</text><text x="620" y="535">L29</text><text x="860" y="535">L43</text><text x="1070" y="535">L57</text></g>
  <g font-family="Arial, sans-serif" font-size="11" fill="#334155"><rect x="155" y="572" width="18" height="12" fill="#e10600"/><text x="180" y="583">Soft</text><rect x="230" y="572" width="18" height="12" fill="#ffd12e"/><text x="255" y="583">Medium</text><rect x="325" y="572" width="18" height="12" fill="#cbd5e1" stroke="#475569"/><text x="350" y="583">Hard</text><path d="M405 584 l6 -10 l6 10 z" fill="#172033"/><text x="425" y="583">Pit stop</text><rect x="485" y="572" width="18" height="12" fill="#f6c445" opacity="0.45"/><text x="510" y="583">Safety Car</text><rect x="590" y="572" width="18" height="12" fill="#60a5fa" opacity="0.35"/><text x="615" y="583">VSC</text><text x="155" y="608">Pit markers stay on driver rows and share one legend key. Hatching distinguishes unknown or conflicting source data.</text></g>
</svg>
