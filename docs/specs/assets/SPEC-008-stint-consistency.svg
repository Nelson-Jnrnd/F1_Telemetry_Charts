<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Stint Pace Summary reference</title>
  <desc id="desc">Faster-first horizontal comparison of driver stints using direct row labels, light min-max ranges, dark IQR bands, prominent median points, and a compact encoding key.</desc>
  <rect width="1200" height="675" fill="#0b1020"/>
  <text x="54" y="54" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Stint Pace Summary</text>
  <text x="54" y="82" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="14">Representative green-running laps · sorted by median · lower lap time is faster</text>
  <rect x="54" y="105" width="1092" height="72" rx="10" fill="#111827" stroke="#334155"/>
  <g font-family="Inter,Arial,sans-serif" font-size="12" fill="#cbd5e1">
    <circle cx="92" cy="133" r="7" fill="#38bdf8" stroke="#f8fafc" stroke-width="2"/><text x="109" y="137">dot = median</text>
    <line x1="267" y1="133" x2="329" y2="133" stroke="#38bdf8" stroke-width="12" opacity=".75"/><text x="341" y="137">dark band = IQR</text>
    <line x1="515" y1="133" x2="577" y2="133" stroke="#38bdf8" stroke-width="12" opacity=".18"/><text x="589" y="137">light band = min/max</text>
  </g>

  <rect x="54" y="195" width="1092" height="352" rx="12" fill="#111827" stroke="#334155"/>
  <g stroke="#334155" stroke-width="1"><line x1="320" y1="225" x2="320" y2="505"/><line x1="487" y1="225" x2="487" y2="505"/><line x1="654" y1="225" x2="654" y2="505"/><line x1="821" y1="225" x2="821" y2="505"/></g>
  <g fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="12"><text x="310" y="528">91.0</text><text x="477" y="528">91.5</text><text x="644" y="528">92.0</text><text x="811" y="528">92.5</text><text x="569" y="575" text-anchor="middle" fill="#cbd5e1" font-size="14">Representative lap time (s)</text></g>
  <g font-family="Inter,Arial,sans-serif">
    <text x="76" y="254" fill="#f8fafc" font-size="15" font-weight="700">NOR · Stint 2</text><rect x="200" y="235" width="72" height="25" rx="12" fill="#facc15"/><text x="236" y="252" text-anchor="middle" fill="#111827" font-size="11" font-weight="700">MEDIUM</text>
    <line x1="360" y1="248" x2="645" y2="248" stroke="#94a3b8" stroke-width="4" opacity=".45"/><line x1="330" y1="248" x2="685" y2="248" stroke="#64748b"/><line x1="330" y1="239" x2="330" y2="257" stroke="#64748b"/><line x1="685" y1="239" x2="685" y2="257" stroke="#64748b"/><line x1="420" y1="248" x2="590" y2="248" stroke="#f97316" stroke-width="12"/><circle cx="492" cy="248" r="7" fill="#f8fafc" stroke="#f97316" stroke-width="3"/>
    <text x="868" y="246" fill="#f8fafc" font-size="14">+0.043 s/lap</text><text x="868" y="264" fill="#34d399" font-size="11">HIGH · n=16</text>

    <text x="76" y="326" fill="#f8fafc" font-size="15" font-weight="700">LEC · Stint 2</text><rect x="200" y="307" width="72" height="25" rx="12" fill="#facc15"/><text x="236" y="324" text-anchor="middle" fill="#111827" font-size="11" font-weight="700">MEDIUM</text>
    <line x1="382" y1="320" x2="675" y2="320" stroke="#94a3b8" stroke-width="4" opacity=".45"/><line x1="348" y1="320" x2="720" y2="320" stroke="#64748b"/><line x1="348" y1="311" x2="348" y2="329" stroke="#64748b"/><line x1="720" y1="311" x2="720" y2="329" stroke="#64748b"/><line x1="441" y1="320" x2="628" y2="320" stroke="#ef4444" stroke-width="12"/><circle cx="520" cy="320" r="7" fill="#f8fafc" stroke="#ef4444" stroke-width="3"/>
    <text x="868" y="318" fill="#f8fafc" font-size="14">+0.052 s/lap</text><text x="868" y="336" fill="#34d399" font-size="11">HIGH · n=15</text>

    <text x="76" y="398" fill="#f8fafc" font-size="15" font-weight="700">RUS · Stint 2</text><rect x="200" y="379" width="72" height="25" rx="12" fill="#facc15"/><text x="236" y="396" text-anchor="middle" fill="#111827" font-size="11" font-weight="700">MEDIUM</text>
    <line x1="410" y1="392" x2="746" y2="392" stroke="#94a3b8" stroke-width="4" opacity=".45"/><line x1="374" y1="392" x2="788" y2="392" stroke="#64748b"/><line x1="374" y1="383" x2="374" y2="401" stroke="#64748b"/><line x1="788" y1="383" x2="788" y2="401" stroke="#64748b"/><line x1="477" y1="392" x2="704" y2="392" stroke="#38bdf8" stroke-width="12"/><circle cx="561" cy="392" r="7" fill="#f8fafc" stroke="#38bdf8" stroke-width="3"/>
    <text x="868" y="390" fill="#f8fafc" font-size="14">+0.061 s/lap</text><text x="868" y="408" fill="#fbbf24" font-size="11">MEDIUM · n=13</text>

    <text x="76" y="470" fill="#f8fafc" font-size="15" font-weight="700">HAM · Stint 1</text><rect x="200" y="451" width="64" height="25" rx="12" fill="#ef4444"/><text x="232" y="468" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">SOFT</text>
    <line x1="449" y1="464" x2="810" y2="464" stroke="#94a3b8" stroke-width="4" opacity=".45"/><line x1="414" y1="464" x2="850" y2="464" stroke="#64748b"/><line x1="414" y1="455" x2="414" y2="473" stroke="#64748b"/><line x1="850" y1="455" x2="850" y2="473" stroke="#64748b"/><line x1="508" y1="464" x2="754" y2="464" stroke="#a855f7" stroke-width="12"/><circle cx="602" cy="464" r="7" fill="#f8fafc" stroke="#a855f7" stroke-width="3"/>
    <text x="868" y="462" fill="#f8fafc" font-size="14">+0.078 s/lap</text><text x="868" y="480" fill="#fbbf24" font-size="11">MEDIUM · n=11</text>
  </g>
  <rect x="54" y="598" width="1092" height="40" rx="8" fill="#111827" stroke="#334155"/><text x="74" y="623" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="12">Up to 20 rows · desktop scrolls · export paginates · slope ranking disabled when result bases differ</text>
</svg>
