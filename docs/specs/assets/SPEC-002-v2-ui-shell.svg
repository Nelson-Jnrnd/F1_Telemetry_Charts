<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">V2 local UI shell wireframe</title>
  <desc id="desc">Wireframe of the V2 React browser UI with left navigation, top status bar, package preview workspace, and right detail panel.</desc>
  <rect width="1280" height="820" fill="#f4f7fb"/>

  <rect x="0" y="0" width="1280" height="56" fill="#1f2933"/>
  <text x="28" y="36" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">F1 Telemetry Charts</text>
  <text x="1040" y="35" font-family="Arial, sans-serif" font-size="13" fill="#d9e2ec">Loopback server: 127.0.0.1</text>

  <rect x="0" y="56" width="208" height="764" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="24" y="96" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#52606d">WORKSPACE</text>
  <rect x="16" y="122" width="176" height="44" rx="4" fill="#e6f6ff" stroke="#62b0e8"/>
  <text x="48" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0b5cad">Package Preview</text>
  <rect x="16" y="178" width="176" height="44" rx="4" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="48" y="206" font-family="Arial, sans-serif" font-size="14" fill="#334e68">Workbench</text>
  <rect x="16" y="234" width="176" height="44" rx="4" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="48" y="262" font-family="Arial, sans-serif" font-size="14" fill="#334e68">Plugins</text>
  <rect x="16" y="290" width="176" height="44" rx="4" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="48" y="318" font-family="Arial, sans-serif" font-size="14" fill="#334e68">Run History</text>

  <text x="24" y="388" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#52606d">CURRENT PACKAGE</text>
  <rect x="16" y="414" width="176" height="114" rx="4" fill="#f8fafc" stroke="#d9e2ec"/>
  <text x="32" y="444" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#243b53">2026 Bahrain Race</text>
  <text x="32" y="472" font-family="Arial, sans-serif" font-size="12" fill="#52606d">10 charts</text>
  <text x="32" y="496" font-family="Arial, sans-serif" font-size="12" fill="#52606d">18 observations</text>
  <text x="32" y="520" font-family="Arial, sans-serif" font-size="12" fill="#2f855a">Integrity: pass</text>

  <rect x="232" y="80" width="716" height="716" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
  <text x="260" y="118" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243b53">Package Preview</text>
  <rect x="738" y="92" width="86" height="34" rx="4" fill="#2f9e44"/>
  <text x="762" y="114" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Open</text>
  <rect x="836" y="92" width="84" height="34" rx="4" fill="#ffffff" stroke="#bcccdc"/>
  <text x="854" y="114" font-family="Arial, sans-serif" font-size="13" fill="#334e68">Refresh</text>

  <rect x="260" y="148" width="660" height="82" rx="4" fill="#f8fafc" stroke="#d9e2ec"/>
  <text x="282" y="178" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243b53">PackageSummaryHeader</text>
  <text x="282" y="204" font-family="Arial, sans-serif" font-size="13" fill="#52606d">Run metadata, driver set, chart count, observation count, package path</text>
  <rect x="782" y="170" width="110" height="34" rx="4" fill="#eefaf6" stroke="#57ae85"/>
  <text x="812" y="192" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2f855a">Healthy</text>

  <rect x="260" y="256" width="660" height="42" rx="4" fill="#eef2f7" stroke="#d9e2ec"/>
  <text x="288" y="282" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0b5cad">Overview</text>
  <text x="398" y="282" font-family="Arial, sans-serif" font-size="13" fill="#52606d">Charts</text>
  <text x="500" y="282" font-family="Arial, sans-serif" font-size="13" fill="#52606d">Observations</text>
  <text x="640" y="282" font-family="Arial, sans-serif" font-size="13" fill="#52606d">Draft</text>
  <text x="730" y="282" font-family="Arial, sans-serif" font-size="13" fill="#52606d">Integrity</text>

  <rect x="260" y="324" width="306" height="178" rx="4" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="282" y="354" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243b53">ChartGallery</text>
  <rect x="282" y="376" width="120" height="78" fill="#f0f4f8" stroke="#bcccdc"/>
  <polyline points="292,434 318,420 346,426 374,394 392,404" fill="none" stroke="#d64545" stroke-width="3"/>
  <rect x="424" y="376" width="120" height="78" fill="#f0f4f8" stroke="#bcccdc"/>
  <polyline points="434,428 462,410 490,414 516,388 536,398" fill="none" stroke="#1f7a8c" stroke-width="3"/>
  <text x="282" y="482" font-family="Arial, sans-serif" font-size="12" fill="#52606d">Select chart to update detail panel</text>

  <rect x="592" y="324" width="328" height="178" rx="4" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="614" y="354" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243b53">ObservationReviewPanel</text>
  <rect x="614" y="376" width="284" height="32" rx="4" fill="#eefaf6" stroke="#57ae85"/>
  <text x="632" y="397" font-family="Arial, sans-serif" font-size="12" fill="#243b53">accepted - race pace gap</text>
  <rect x="614" y="420" width="284" height="32" rx="4" fill="#fffaf0" stroke="#f0b429"/>
  <text x="632" y="441" font-family="Arial, sans-serif" font-size="12" fill="#243b53">edited - tyre offset</text>
  <rect x="614" y="464" width="284" height="28" rx="4" fill="#f8fafc" stroke="#bcccdc"/>
  <text x="632" y="483" font-family="Arial, sans-serif" font-size="12" fill="#52606d">unreviewed - traffic loss</text>

  <rect x="260" y="528" width="660" height="228" rx="4" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="282" y="560" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243b53">DraftPreviewPanel</text>
  <rect x="282" y="584" width="302" height="134" rx="4" fill="#f8fafc" stroke="#d9e2ec"/>
  <text x="304" y="614" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#243b53">Rendered Markdown</text>
  <text x="304" y="642" font-family="Arial, sans-serif" font-size="12" fill="#52606d">react-markdown + remark-gfm</text>
  <text x="304" y="670" font-family="Arial, sans-serif" font-size="12" fill="#52606d">Raw HTML disabled or sanitized</text>
  <rect x="610" y="584" width="288" height="134" rx="4" fill="#f8fafc" stroke="#d9e2ec"/>
  <text x="632" y="614" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#243b53">Raw Markdown</text>
  <text x="632" y="642" font-family="Arial, sans-serif" font-size="12" fill="#52606d">Source text, chart references, warnings</text>

  <rect x="972" y="80" width="276" height="716" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
  <text x="996" y="118" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#243b53">Detail Panel</text>
  <text x="996" y="150" font-family="Arial, sans-serif" font-size="13" fill="#52606d">Updates from selected chart, observation, plugin, or run</text>
  <rect x="996" y="180" width="228" height="138" rx="4" fill="#f8fafc" stroke="#d9e2ec"/>
  <text x="1018" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243b53">ChartDetailPanel</text>
  <text x="1018" y="240" font-family="Arial, sans-serif" font-size="12" fill="#52606d">Metadata</text>
  <text x="1018" y="266" font-family="Arial, sans-serif" font-size="12" fill="#52606d">Artifact path</text>
  <text x="1018" y="292" font-family="Arial, sans-serif" font-size="12" fill="#52606d">Related observations</text>

  <rect x="996" y="344" width="228" height="170" rx="4" fill="#fffaf0" stroke="#f0b429"/>
  <text x="1018" y="374" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243b53">Actions</text>
  <rect x="1018" y="396" width="84" height="34" rx="4" fill="#2f9e44"/>
  <text x="1042" y="418" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Accept</text>
  <rect x="1118" y="396" width="84" height="34" rx="4" fill="#f0b429"/>
  <text x="1148" y="418" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#243b53">Edit</text>
  <rect x="1018" y="444" width="184" height="34" rx="4" fill="#ffffff" stroke="#bcccdc"/>
  <text x="1054" y="466" font-family="Arial, sans-serif" font-size="12" fill="#334e68">Regenerate Draft</text>

  <rect x="996" y="540" width="228" height="174" rx="4" fill="#f8fafc" stroke="#d9e2ec"/>
  <text x="1018" y="570" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243b53">Notifications</text>
  <rect x="1018" y="592" width="184" height="34" rx="4" fill="#eefaf6" stroke="#57ae85"/>
  <text x="1036" y="614" font-family="Arial, sans-serif" font-size="12" fill="#2f855a">review saved</text>
  <rect x="1018" y="638" width="184" height="44" rx="4" fill="#fff5f5" stroke="#d64545"/>
  <text x="1036" y="662" font-family="Arial, sans-serif" font-size="12" fill="#d64545">missing chart asset</text>
</svg>
