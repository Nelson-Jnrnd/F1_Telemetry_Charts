<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">SPEC-008 Pit-Cycle Comparison reference</title>
  <desc id="desc">One explicit focal stop with measured pre and post direct gaps, four labelled reference boundaries, and driver-labelled compound rows limited to the pit-cycle window.</desc>
  <rect width="1200" height="675" fill="#f5f7fa"/>
  <rect x="42" y="34" width="1116" height="607" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="600" y="72" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172033">2023 Bahrain GP Race Pit Cycle: VER Stop 1 vs PER</text>
  <text x="600" y="98" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">Pre L13: +1.250 s · Post L16: −0.480 s · VER gained 1.730 s relative to PER</text>

  <rect x="90" y="132" width="1020" height="294" fill="#fbfcfe" stroke="#cbd5e1"/>
  <g stroke="#e2e8f0" stroke-width="1"><line x1="90" y1="196" x2="1110" y2="196"/><line x1="90" y1="260" x2="1110" y2="260"/><line x1="90" y1="324" x2="1110" y2="324"/><line x1="90" y1="388" x2="1110" y2="388"/></g>
  <rect x="472" y="132" width="256" height="294" fill="#94a3b8" opacity="0.16"/>
  <text x="600" y="154" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#334155">PIT INTERVAL</text>
  <path d="M218 228 L856 354" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 5"/>
  <circle cx="218" cy="228" r="7" fill="#3671c6"/><circle cx="856" cy="354" r="7" fill="#3671c6"/>
  <text x="235" y="217" font-family="Arial" font-size="12" font-weight="700" fill="#1e3a8a">Pre +1.250 s</text>
  <text x="873" y="373" font-family="Arial" font-size="12" font-weight="700" fill="#1e3a8a">Post −0.480 s</text>
  <text x="26" y="340" transform="rotate(-90 26 340)" font-family="Arial" font-size="12" fill="#334155">Positive means VER behind PER (s)</text>

  <g font-family="Arial" font-size="11" font-weight="700">
    <line x1="218" y1="132" x2="218" y2="618" stroke="#64748b" stroke-width="2" stroke-dasharray="2 4"/><text x="218" y="124" text-anchor="middle" fill="#475569">Pre ref L13</text>
    <line x1="472" y1="132" x2="472" y2="618" stroke="#991b1b" stroke-width="2" stroke-dasharray="7 5"/><text x="472" y="124" text-anchor="middle" fill="#991b1b">Pit-in L14</text>
    <line x1="728" y1="132" x2="728" y2="618" stroke="#991b1b" stroke-width="2" stroke-dasharray="7 5"/><text x="728" y="124" text-anchor="middle" fill="#991b1b">Pit-out L15</text>
    <line x1="856" y1="132" x2="856" y2="618" stroke="#64748b" stroke-width="2" stroke-dasharray="2 4"/><text x="856" y="124" text-anchor="middle" fill="#475569">Post ref L16</text>
  </g>

  <text x="90" y="458" font-family="Arial" font-size="14" font-weight="700" fill="#172033">Pit-cycle window</text>
  <rect x="90" y="474" width="1020" height="144" fill="#fbfcfe" stroke="#cbd5e1"/>
  <text x="72" y="516" text-anchor="end" font-family="Arial" font-size="13" fill="#334155">VER</text>
  <text x="72" y="574" text-anchor="end" font-family="Arial" font-size="13" fill="#334155">PER</text>
  <rect x="112" y="491" width="360" height="36" rx="3" fill="#da291c" stroke="#475569"/>
  <rect x="728" y="491" width="360" height="36" rx="3" fill="#ffd12e" stroke="#475569"/>
  <rect x="112" y="549" width="976" height="36" rx="3" fill="#da291c" stroke="#475569"/>
  <g font-family="Arial" font-size="12" fill="#334155"><rect x="902" y="603" width="18" height="10" fill="#da291c" stroke="#475569"/><text x="928" y="613">Soft</text><rect x="978" y="603" width="18" height="10" fill="#ffd12e" stroke="#475569"/><text x="1004" y="613">Medium</text></g>
</svg>
