<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">SPEC-008 Compound Comparison reference</title>
  <desc id="desc">Categorical Hard and Medium representative samples with visible sample-size imbalance, compound colours, median and IQR marks, and a descriptive-only headline.</desc>
  <rect width="1200" height="675" fill="#f5f7fa"/>
  <rect x="44" y="30" width="1112" height="610" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="600" y="70" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172033">2023 Bahrain GP Race Compound Comparison</text>
  <text x="600" y="96" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">Descriptive only · Hard n=18 · Medium n=5</text>
  <rect x="92" y="126" width="1016" height="446" fill="#fbfcfe" stroke="#cbd5e1"/>
  <g stroke="#e2e8f0"><line x1="92" y1="190" x2="1108" y2="190"/><line x1="92" y1="270" x2="1108" y2="270"/><line x1="92" y1="350" x2="1108" y2="350"/><line x1="92" y1="430" x2="1108" y2="430"/><line x1="92" y1="510" x2="1108" y2="510"/></g>
  <text x="26" y="420" transform="rotate(-90 26 420)" font-family="Arial" font-size="12" fill="#334155">Representative lap time (s)</text>

  <g fill="#f4f4f4" stroke="#475569" stroke-width="1.5">
    <circle cx="318" cy="220" r="6"/><circle cx="338" cy="238" r="6"/><circle cx="300" cy="252" r="6"/><circle cx="352" cy="269" r="6"/><circle cx="325" cy="286" r="6"/><circle cx="365" cy="301" r="6"/><circle cx="292" cy="318" r="6"/><circle cx="344" cy="332" r="6"/><circle cx="312" cy="350" r="6"/><circle cx="373" cy="366" r="6"/><circle cx="286" cy="382" r="6"/><circle cx="356" cy="397" r="6"/><circle cx="305" cy="415" r="6"/><circle cx="368" cy="432" r="6"/><circle cx="296" cy="448" r="6"/><circle cx="346" cy="465" r="6"/><circle cx="322" cy="482" r="6"/><circle cx="360" cy="498" r="6"/>
  </g>
  <g fill="#ffd12e"><circle cx="820" cy="322" r="6"/><circle cx="850" cy="350" r="6"/><circle cx="805" cy="378" r="6"/><circle cx="866" cy="406" r="6"/><circle cx="832" cy="434" r="6"/></g>

  <rect x="270" y="270" width="120" height="160" fill="#f4f4f4" fill-opacity="0.45" stroke="#111827" stroke-width="2"/><line x1="270" y1="350" x2="390" y2="350" stroke="#111827" stroke-width="4"/>
  <rect x="775" y="350" width="120" height="56" fill="#ffd12e" fill-opacity="0.28" stroke="#111827" stroke-width="2"/><line x1="775" y1="378" x2="895" y2="378" stroke="#111827" stroke-width="4"/>
  <g font-family="Arial" font-size="11" fill="#334155"><text x="245" y="214">median 96.420 s · IQR 0.610 s</text><text x="750" y="318">median 96.770 s · IQR 0.220 s</text><text x="330" y="548" text-anchor="middle" font-weight="700">n=18</text><text x="835" y="548" text-anchor="middle" font-weight="700">n=5</text></g>
  <g font-family="Arial" font-size="14" font-weight="700" fill="#172033"><text x="330" y="600" text-anchor="middle">Hard</text><text x="835" y="600" text-anchor="middle">Medium</text></g>
  <text x="600" y="626" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">Compound</text>
</svg>
