  <circle cx="320" cy="268" r="7" fill="#38bdf8"/><circle cx="930" cy="177" r="7" fill="#38bdf8"/>
  <g fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700"><text x="286" y="157">Pre ref L13</text><text x="510" y="157" fill="#f87171">Pit-in L14</text><text x="605" y="157">Pit interval</text><text x="674" y="157" fill="#f87171">Pit-out L15</text><text x="900" y="157">Post ref L16</text></g>
  <text x="330" y="272" fill="#38bdf8" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700">Pre −10.943 s</text><text x="920" y="169" text-anchor="end" fill="#38bdf8" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700">Post +10.339 s</text>

