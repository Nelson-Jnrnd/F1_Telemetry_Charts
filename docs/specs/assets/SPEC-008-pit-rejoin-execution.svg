<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Compact Pit Rejoin and Execution reference</title>
  <desc id="desc">One coherent pit-cycle chart with measured direct-gap endpoints, a two-driver pit window, and one compact contextual strip for rejoin state and focal pit-lane duration.</desc>
  <rect width="1200" height="675" fill="#0b1020"/>
