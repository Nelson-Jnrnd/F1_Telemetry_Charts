  <text x="72" y="130" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">MEASURED DIRECT-GAP ENDPOINTS</text>
  <g stroke="#334155" stroke-width="1"><line x1="92" y1="286" x2="1110" y2="286"/><line x1="92" y1="218" x2="1110" y2="218"/><line x1="92" y1="150" x2="1110" y2="150"/></g>
