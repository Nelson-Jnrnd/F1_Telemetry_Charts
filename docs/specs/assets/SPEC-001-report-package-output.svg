<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Report package output wireframe</title>
  <desc id="desc">Wireframe showing output package structure with chart images, metadata, observations, warnings, and Markdown draft.</desc>
  <rect width="1200" height="760" fill="#f7f9fb"/>
  <rect x="0" y="0" width="1200" height="56" fill="#202a36"/>
  <text x="28" y="36" font-family="Arial, sans-serif" font-size="20" fill="#ffffff">Report Package</text>
  <text x="956" y="35" font-family="Arial, sans-serif" font-size="14" fill="#d9e2ec">manifest.json</text>

  <rect x="26" y="84" width="320" height="650" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
  <text x="50" y="118" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#243b53">Package tree</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#334e68">
    <text x="58" y="160">run-2026-monaco-race/</text>
    <text x="78" y="198">manifest.json</text>
    <text x="78" y="236">charts/</text>
    <text x="98" y="274">telemetry_trace.png</text>
    <text x="98" y="312">lap_time_delta.png</text>
