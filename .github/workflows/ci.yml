name: ci

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Validate governance files
        run: python scripts/validate_governance.py

      - name: Validate specs
        run: python scripts/validate_specs.py

      - name: Validate drift
        run: python scripts/validate_drift.py
