name: Bug report
description: Report incorrect behavior.
title: "[Bug] <short title>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report a defect. If the fix changes behavior, an agent may write a
        small spec or amendment before implementing.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What actually happens?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps to trigger the bug.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, version, browser, or other relevant context.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste logs or attach screenshots.
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Possible affected area
      description: Component or file you suspect, if known.
    validations:
      required: false
